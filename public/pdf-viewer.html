<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executives Magazine Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        #viewer-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }
        .page-container {
            position: relative;
            margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            background-color: white;
            max-width: 95vw;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        .loading-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #c9a84c;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            font-size: 10px;
            font-weight: bold;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 4px;
            border: 1px border rgba(201, 168, 76, 0.2);
            text-align: center;
        }
        #progress-bar {
            width: 200px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            margin-top: 15px;
            position: relative;
            overflow: hidden;
        }
        #progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #c9a84c;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading-indicator">
        Initializing Reader
        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>
    <div id="viewer-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pdfUrl = urlParams.get('file');
        
        if (!pdfUrl) {
            document.body.innerHTML = '<div style="color:white; padding:50px; text-align:center;">No document specified.</div>';
        } else {
            const pdfjsLib = window['pdfjs-dist/build/pdf'];
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            const container = document.getElementById('viewer-container');
            const loading = document.getElementById('loading');
            const progressFill = document.getElementById('progress-fill');

            let pdfDoc = null;
            let pagesLoaded = 0;

            async function renderPage(pageNum) {
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 2 }); // High quality scale
                
                const pageContainer = document.createElement('div');
                pageContainer.className = 'page-container';
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                pageContainer.appendChild(canvas);
                container.appendChild(pageContainer);
                
                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                pagesLoaded++;
                const percent = Math.round((pagesLoaded / pdfDoc.numPages) * 100);
                progressFill.style.width = percent + '%';
                
                if (pagesLoaded === 1) {
                    loading.style.display = 'none';
                }
            }

            pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
                pdfDoc = pdf;
                // Render first page immediately for perceived speed
                await renderPage(1);
                
                // Then render the rest
                for (let i = 2; i <= pdf.numPages; i++) {
                    await renderPage(i);
                }
            }).catch(err => {
                console.error('Error loading PDF:', err);
                document.body.innerHTML = `<div style="color:white; padding:50px; text-align:center;">Error loading document. Please try downloading it directly.<br><br>${err.message}</div>`;
            });
        }
    </script>
</body>
</html>
